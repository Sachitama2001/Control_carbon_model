[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-carbon-model"
version = "0.1.0"
description = "Control-theoretic analysis of terrestrial ecosystem carbon-cycle models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.scripts]
control-carbon-era5 = "control_carbon.era5_cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
era5 = ["cdsapi>=0.7", "h5py>=3.8"]
analysis = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
